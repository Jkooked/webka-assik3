<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        h1 {font-size: 20px;}
        h2 {font-size: 16px;}
        p {font-size: 12px;}
        
        @media (min-width: 768px) {
            h1 {font-size: 32px;}
            h2 {font-size: 24px;}
            p {font-size: 16px;}
        }

        @media (min-width: 1024px) {
            h1 {font-size: 48px;}
            h2 {font-size: 36px;}
            p {font-size: 24px;}
        }
    </style>
</head>
<body>
    <h1>Hello, World!</h1>
    <h2>Welcome to my website</h2>
    <p>This is a simple HTML document.</p>
</body>
</html>
